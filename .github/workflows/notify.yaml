name: CI notify

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual notification'
        required: false
        default: 'Manual trigger'
        type: string
  workflow_run:
    workflows: ['Node.js Package']
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Echo reason
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Manual dispatch reason: $REASON"
        env:
          REASON: ${{ github.event.inputs.reason }}

      - name: Echo success
        if: ${{ github.event_name == 'workflow_run' }}
        run: echo "CI notify triggered by successful 'Node.js Package' workflow"
