# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish to: latest | next'
        required: true
        default: 'latest'
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    outputs:
      npm_tag: ${{github.event.inputs.tag}}
    steps:
      - name: Check Tag Name
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'latest' && github.event.inputs.tag != 'next' }}
        run: |
          echo 'Only the tags "latest" or "next" are supported. You entered "${{ github.event.inputs.tag }}"'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'
          registry-url: https://registry.npmjs.org/
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies (skip Playwright browsers)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm ci
      - name: Lint code
        run: npm run lint:check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build:Production and run unit tests
        run: npm run test:unit
      - name: Run PlayWright Smoke Tests
        run: |
          export RSDK_ACCESS_TOKEN=$(node test/integration/generate-access-token.cjs)
          npm run integration:playwright:run
        env:
          RSDK_ADOBE_CLIENT_ID: ${{ secrets.RSDK_ADOBE_CLIENT_ID  }}
          RSDK_ADOBE_CLIENT_SECRET: ${{ secrets.RSDK_ADOBE_CLIENT_SECRET }}
          RSDK_ADOBE_SCOPES: ${{ secrets.RSDK_ADOBE_SCOPES }}
          RSDK_ADOBE_ORG_ID: ${{ secrets.RSDK_ADOBE_ORG_ID }}
          RSDK_ADOBE_REACTOR_COMPANY_ID: ${{ secrets.RSDK_ADOBE_REACTOR_COMPANY_ID }}
          RSDK_ADOBE_REACTOR_URL: ${{ secrets.RSDK_ADOBE_REACTOR_URL }}
          RSDK_ADOBE_ENVIRONMENT: ${{ secrets.RSDK_ADOBE_ENVIRONMENT }}
      - name: Clean Sensitive Files
        if: always()
        run: npm run clean:integration:setup
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
          tag: ${{ github.event.inputs.tag || 'latest' }}
