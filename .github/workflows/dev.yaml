# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    name: 'Test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'
          registry-url: https://registry.npmjs.org/
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint code
        run: npm run lint:check
      - name: Create .env file for integration tests
        run: |
          cat > .env << EOF
          # GitHub Actions environment - integration tests will use mock/test values
          RSDK_ADOBE_CLIENT_ID=${{ secrets.RSDK_ADOBE_CLIENT_ID  }}
          RSDK_ADOBE_CLIENT_SECRET=${{ secrets.RSDK_ADOBE_CLIENT_SECRET }}
          RSDK_ADOBE_SCOPES=${{ secrets.RSDK_ADOBE_SCOPES }}
          RSDK_ADOBE_ORG_ID=${{ secrets.RSDK_ADOBE_ORG_ID }}
          RSDK_ADOBE_REACTOR_COMPANY_ID=${{ secrets.RSDK_ADOBE_REACTOR_COMPANY_ID }}
          RSDK_ADOBE_REACTOR_URL=${{ secrets.RSDK_ADOBE_REACTOR_URL }}
          RSDK_ADOBE_ENVIRONMENT=${{ secrets.RSDK_ADOBE_ENVIRONMENT }}
          EOF
      - name: Build project
        run: npm run build:production
      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
      - name: Clean Sensitive Files
        if: always()
        run: |
          npm run clean:integration:setup
          rm -rf .env
